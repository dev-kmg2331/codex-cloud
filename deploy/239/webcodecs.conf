map $http_upgrade $webcodecs_connection {
    default upgrade;
    '' close;
}

server {
    listen 3000 ssl;
    server_name 192.168.182.239;

    ssl_certificate /etc/nginx/webcodecs-tls/webcodecs.crt;
    ssl_certificate_key /etc/nginx/webcodecs-tls/webcodecs.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $webcodecs_connection;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
